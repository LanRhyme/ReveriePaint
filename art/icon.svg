      <stop offset="0%" stop-color="#9dbff8"/>
      <stop offset="30%" stop-color="#a2bcf5"/>
      <stop offset="65%" stop-color="#b1a7ed"/>
      <stop offset="100%" stop-color="#bbaaf0"/>
    </linearGradient>
  </defs>

  <!-- 底部笔刷笔触 -->
  <g id="brush-stroke">
    <!-- 笔触左段 -->
    <path fill="url(#brushGrad)" d="
      M 42 168
      C 43.5 165 47 162 52 158.5
      C 57 154.5 62 150.5 67 146.5
      C 72 143 77 139.5 82 136.5
      C 85 135 88 134 90.5 133.5
      L 93 144.5
      L 90 146
      C 85 149.5 80 153 75 155.5
      C 70 159 66 162.5 63.5 162
      C 61 160.5 57 163 53 166.5
      C 49 169.5 45 170.5 42 168
      Z"/>
    <!-- 笔触右段 -->
    <path fill="url(#brushGrad)" d="
      M 105 128
      C 110 126 115 123.5 120 121.5
      C 125 119.5 130 118 135 116.5
      C 140 114.5 145 113.5 151 115.5
      C 152 117 151 119 148 120.5
      C 143 122.5 138 124.5 133 126.5
      C 128 128.5 123 131 118 133
      C 113 135 108 137.5 103 139.5
      C 101 140.5 99.5 139 100 137
      C 101 133 103 130 105 128
      Z"/>
  </g>

  <!-- 四角星芒主体 -->
  <g id="star">
