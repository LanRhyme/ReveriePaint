    <path id="star-white" fill="#ffffff" d="
      M 96.5 30.0
      C 94 45 89 60 85.5 73.5
      C 82 76 77 78 73.5 80
      C 70 82 68.5 86 68.5 86
      C 66 88.5 63 89.6 60 89.6
      C 57.5 89.6 56 87.5 55.5 86.0
      L 44.5 88.3
      C 55 91.5 65 94.5 75 97.5
      C 79 98.7 82 99.8 84.5 100.5
      L 89.6 114.8
      L 121.2 79.0
      C 117 77.5 112 75.5 107.5 73.5
      L 102.5 52.0
      L 95.5 64.5
      L 100.6 46.0
      Z"/>
