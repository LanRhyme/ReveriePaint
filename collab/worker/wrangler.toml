#:schema node_modules/wrangler/config-schema.json
name = "reveriepaint-collab"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true

# 自定义域名 (与 telemetry 一致: 国内直连自家 zone 绕开 workers.dev DNS 污染)
routes = [
  { pattern = "reverieteapaint.lanrhyme.top", custom_domain = true }
]

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "CollabRoom"

[[durable_objects.bindings]]
name = "DIRECTORY"
class_name = "RoomDirectory"

# Free 计划要求使用 SQLite-backed Durable Objects
[[migrations]]
tag = "v1"
new_sqlite_classes = ["CollabRoom"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["RoomDirectory"]

[vars]
DISABLED = "0"
STUN_URLS = "stun.hitv.com,stun.miwifi.com,stun.chat.bilibili.com,txt:stun.easytier.cn"
STUN_V6_URLS = "txt:stun-v6.easytier.cn"
# 可选 EasyTier 中继节点列表 (逗号分隔, 如 tcp://hk.example.com:11010,udp://hk.example.com:11010)
RELAY_PEERS = "tcp://47.95.242.43:11010,udp://47.95.242.43:11010"
ROOM_TTL_MS = "86400000"
IDLE_TTL_MS = "1800000"
# 异常掉线成员昵称占位与虚拟 IP 的清理阈值 (毫秒)
GHOST_PEER_TTL_MS = "600000"
# 房主断线后凭 peerId 重新认领的窗口 (毫秒), 窗口外必须带正确 hostToken
HOST_RECLAIM_WINDOW_MS = "60000"
