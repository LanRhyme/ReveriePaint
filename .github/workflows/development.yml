name: Development Build

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Cache Gradle wrapper distribution
        # 只缓存 ~/.gradle/caches 时, 每次构建都要重新从 services.gradle.org 下 ~230MB 的
        # gradle-9.5.0-all.zip; GitHub 侧偶发读超时 (networkTimeout 只有 10s) 会让整个
        # Release 构建在第一步就失败 (1.8.2 首次发布即因此失败两次)。这里把 wrapper 的
        # 发行包一起缓存, 并给首次下载加带重试的预热。
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper/dists
            ~/.gradle/caches
          key: gradle-w-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-w-

      - name: Prefetch Gradle distribution (retry)
        run: |
          for i in 1 2 3 4; do
            if ./gradlew --version >/dev/null 2>&1; then
              echo "gradle distribution ready (attempt $i)"
              exit 0
            fi
            echo "gradle download attempt $i failed, retrying..."
            sleep 15
          done
          echo "gradle distribution download failed after retries" >&2
          exit 1


      - name: Write Aifadian Config
        env:
          AIFADIAN_API_TOKEN: ${{ secrets.AIFADIAN_API_TOKEN }}
          AIFADIAN_USER_ID: ${{ secrets.AIFADIAN_USER_ID }}
        run: |
          if [ -n "$AIFADIAN_API_TOKEN" ]; then
            echo "AIFADIAN_API_TOKEN=$AIFADIAN_API_TOKEN" >> local.properties
            echo "AIFADIAN_USER_ID=$AIFADIAN_USER_ID" >> local.properties
          fi

      - name: Copy Native Libraries
        run: |
          chmod +x scripts/copy_jni_libs.sh
          ./scripts/copy_jni_libs.sh

      - name: JNI Symbol Coverage Check
        # 预编译 .so 落后于 Kotlin external fun 时在这里失败, 不让崩溃包流出去
        run: |
          chmod +x scripts/check_jni_symbols.sh
          ./scripts/check_jni_symbols.sh

      - name: Architecture Guardrail Check
        run: |
          chmod +x scripts/check_architecture.sh
          ./scripts/check_architecture.sh

      - name: Run Unit Tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Run Android Lint Check
        run: ./gradlew :app:lintDebug

      - name: Build Android Debug APK
        run: ./gradlew assembleDebug

      - name: Prepare Artifact
        run: |
          mkdir -p ci-artifacts
          APK=$(ls app/build/outputs/apk/debug/*.apk 2>/dev/null | head -n 1)
          if [ -n "$APK" ]; then
            cp "$APK" "ci-artifacts/ReveriePaint-debug.apk"
          fi

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ReveriePaint-debug
          path: ci-artifacts/ReveriePaint-debug.apk
          if-no-files-found: error
