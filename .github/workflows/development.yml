name: Development Build

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Write Aifadian Config
        env:
          AIFADIAN_API_TOKEN: ${{ secrets.AIFADIAN_API_TOKEN }}
          AIFADIAN_USER_ID: ${{ secrets.AIFADIAN_USER_ID }}
        run: |
          if [ -n "$AIFADIAN_API_TOKEN" ]; then
            echo "AIFADIAN_API_TOKEN=$AIFADIAN_API_TOKEN" >> local.properties
            echo "AIFADIAN_USER_ID=$AIFADIAN_USER_ID" >> local.properties
          fi

      - name: Build Android Debug APK
        run: ./gradlew assembleDebug

      - name: Prepare Artifact
        run: |
          mkdir -p ci-artifacts
          APK=$(ls app/build/outputs/apk/debug/*.apk 2>/dev/null | head -n 1)
          if [ -n "$APK" ]; then
            cp "$APK" "ci-artifacts/ReveriePaint-debug.apk"
          fi

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ReveriePaint-debug
          path: ci-artifacts/ReveriePaint-debug.apk
          if-no-files-found: error
