name: Automation & Labeler

on:
  issues:
    types: [opened, closed, reopened]
  pull_request_target:
    types: [opened, synchronize, closed, reopened, edited]

permissions:
  issues: write
  pull-requests: write
  contents: read

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - name: Auto Triage & Labeler
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const isPR = !!context.payload.pull_request;
            const issueOrPr = isPR ? context.payload.pull_request : context.payload.issue;
            const issueNumber = issueOrPr.number;
            const action = context.payload.action;

            // Helper: get current labels
            const currentLabels = (issueOrPr.labels || []).map(l => l.name);

            // ==========================================
            // 1. Pull Request Handling
            // ==========================================
            if (isPR) {
              const pr = context.payload.pull_request;
              const labelsToAdd = new Set();
              const labelsToRemove = new Set();

              // (1) PR Size calculation
              if (['opened', 'synchronize', 'reopened'].includes(action)) {
                const totalDiff = (pr.additions || 0) + (pr.deletions || 0);
                let sizeLabel = 'size/xs';
                if (totalDiff >= 1000) sizeLabel = 'size/xxl';
                else if (totalDiff >= 500) sizeLabel = 'size/xl';
                else if (totalDiff >= 100) sizeLabel = 'size/l';
                else if (totalDiff >= 30) sizeLabel = 'size/m';
                else if (totalDiff >= 10) sizeLabel = 'size/s';

                const allSizes = ['size/xs', 'size/s', 'size/m', 'size/l', 'size/xl', 'size/xxl'];
                for (const s of allSizes) {
                  if (s !== sizeLabel && currentLabels.includes(s)) {
                    labelsToRemove.add(s);
                  }
                }
                if (!currentLabels.includes(sizeLabel)) {
                  labelsToAdd.add(sizeLabel);
                }
              }

              // (2) Conventional commit title detection for type:*
              if (['opened', 'edited'].includes(action)) {
                const title = pr.title || '';
                const typeMatch = title.match(/^([a-z]+)(\([a-zA-Z0-9_-]+\))?!?:/);
                if (typeMatch) {
                  const prefix = typeMatch[1];
                  const typeMap = {
                    feat: 'type: feature',
                    fix: 'type: bug',
                    perf: 'type: perf',
                    refactor: 'type: refactor',
                    docs: 'type: docs'
                  };
                  if (typeMap[prefix] && !currentLabels.includes(typeMap[prefix])) {
                    labelsToAdd.add(typeMap[prefix]);
                  }
                }
              }

              // (3) Changed files inspection for scope:*
              if (['opened', 'synchronize'].includes(action)) {
                try {
                  const filesResp = await github.rest.pulls.listFiles({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    pull_number: issueNumber,
                    per_page: 100
                  });
                  const filePaths = filesResp.data.map(f => f.filename);

                  const checkMatch = (regex) => filePaths.some(p => regex.test(p));

                  if (checkMatch(/^app\/src\/main\/cpp\//)) labelsToAdd.add('scope: core/jni');
                  if (checkMatch(/ui\/painting\/brush\//)) labelsToAdd.add('scope: brush');
                  if (checkMatch(/ui\/painting\/layers\//)) labelsToAdd.add('scope: layer');
                  if (checkMatch(/ui\/painting\/canvas\//)) labelsToAdd.add('scope: canvas');
                  if (checkMatch(/(Filter|Color)/i)) labelsToAdd.add('scope: filter');
                  if (checkMatch(/(Selection|Transform)/i)) labelsToAdd.add('scope: selection');
                  if (checkMatch(/(Animation|Playback)/i)) labelsToAdd.add('scope: animation');
                  if (checkMatch(/ui\/painting\/panels\//)) labelsToAdd.add('scope: ui/ux');
                  if (checkMatch(/\.(md|xml)$/) && !checkMatch(/\.(kt|cpp|h)$/)) labelsToAdd.add('type: docs');
                } catch (e) {
                  console.error('Error fetching PR files:', e);
                }
              }

              // (4) PR Lifecycle Status
              if (action === 'opened') {
                if (!currentLabels.includes('status: in-progress') && !currentLabels.includes('status: resolved')) {
                  labelsToAdd.add('status: in-progress');
                }
              } else if (action === 'closed') {
                if (currentLabels.includes('status: in-progress')) {
                  labelsToRemove.add('status: in-progress');
                }
                if (pr.merged && !currentLabels.includes('status: resolved')) {
                  labelsToAdd.add('status: resolved');
                }
              } else if (action === 'reopened') {
                if (currentLabels.includes('status: resolved')) {
                  labelsToRemove.add('status: resolved');
                }
                labelsToAdd.add('status: in-progress');
              }

              // Apply labels
              for (const l of labelsToRemove) {
                if (currentLabels.includes(l)) {
                  try {
                    await github.rest.issues.removeLabel({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      issue_number: issueNumber,
                      name: l
                    });
                  } catch (e) {
                    console.log(`Could not remove label ${l}:`, e.message);
                  }
                }
              }
              const addList = Array.from(labelsToAdd).filter(l => !currentLabels.includes(l));
              if (addList.length > 0) {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  labels: addList
                });
              }
              return;
            }

            // ==========================================
            // 2. Issue Handling
            // ==========================================
            const issue = context.payload.issue;
            const labelsToAdd = new Set();
            const labelsToRemove = new Set();

            if (action === 'opened') {
              // Extract user-authored content, ignoring template headers and hardware spec fields
              let text = (issue.title || '') + ' ';
              const body = issue.body || '';
              const sections = body.split(/^###\s+/m);
              for (const sec of sections) {
                if (!sec.trim()) continue;
                const lines = sec.split('\n');
                const header = lines[0].trim().toLowerCase();
                const content = lines.slice(1).join('\n').trim();
                if (!content || content === '_No response_' || content === '无' || content === '纯触控' || content === 'Touch only') {
                  continue;
                }
                const isMeta = /(app version|应用版本|device|设备|stylus|手写笔|checklist|确认|screenshot|media|截图|log|日志)/i.test(header);
                if (!isMeta) {
                  text += content + ' ';
                }
              }

              // Check title prefix for type tags (e.g. [BUG], [FR], [PERF])
              const titleTrim = (issue.title || '').trim();
              if (/^\[bug\]/i.test(titleTrim) && !currentLabels.includes('type: bug')) {
                labelsToAdd.add('type: bug');
              } else if (/^\[fr\]/i.test(titleTrim) && !currentLabels.includes('type: feature')) {
                labelsToAdd.add('type: feature');
              } else if (/^\[perf\]/i.test(titleTrim) && !currentLabels.includes('type: perf')) {
                labelsToAdd.add('type: perf');
              }

              const keywordRules = [
                { regex: /(笔刷|画笔|笔尖|brush|brushstudio|paintop)/i, label: 'scope: brush' },
                { regex: /(图层|图层组|剪贴蒙版|alpha锁|混合模式|blending|layer)/i, label: 'scope: layer' },
                { regex: /(手写笔|压感|笔触断裂|悬浮光标|防误触|笔身侧键|笔尖偏移|stylus|pen pressure|palm rejection|hover cursor)/i, label: 'hardware: stylus' },
                { regex: /(画布|平移|缩放|旋转视角|双指手势|canvas|viewport|pinch)/i, label: 'scope: canvas' },
                { regex: /(滤镜|色彩调整|色相饱和度|曲线调整|高斯模糊|filter|blur)/i, label: 'scope: filter' },
                { regex: /(选区|套索|自由变换|蚂蚁线|斑马纹|selection|lasso|transform)/i, label: 'scope: selection' },
                { regex: /(逐帧动画|时间轴|洋葱皮|animation|timeline)/i, label: 'scope: animation' },
                { regex: /(主页|快捷栏|工具栏|悬浮窗|设置面板|弹窗|主题|morandi|toolbar)/i, label: 'scope: ui/ux' },
                { regex: /(工程保存|保存失败|导出图片|导入图片|psd|kra|webdav)/i, label: 'scope: io/project' },
                { regex: /(卡顿|掉帧|延迟|fps|perf|perfhud|stutter|lag)/i, label: 'type: perf' }
              ];

              for (const rule of keywordRules) {
                if (rule.regex.test(text) && !currentLabels.includes(rule.label)) {
                  labelsToAdd.add(rule.label);
                }
              }
            } else if (action === 'closed') {
              if (currentLabels.includes('status: in-progress')) {
                labelsToRemove.add('status: in-progress');
              }
              const reason = issue.state_reason;
              if (reason === 'completed' && !currentLabels.includes('status: resolved')) {
                labelsToAdd.add('status: resolved');
              } else if (reason === 'not_planned' && !currentLabels.includes('wontfix')) {
                labelsToAdd.add('wontfix');
              }
            } else if (action === 'reopened') {
              if (currentLabels.includes('status: resolved')) {
                labelsToRemove.add('status: resolved');
              }
              if (currentLabels.includes('wontfix')) {
                labelsToRemove.add('wontfix');
              }
            }

            // Apply labels
            for (const l of labelsToRemove) {
              if (currentLabels.includes(l)) {
                try {
                  await github.rest.issues.removeLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: issueNumber,
                    name: l
                  });
                } catch (e) {
                  console.log(`Could not remove label ${l}:`, e.message);
                }
              }
            }
            const addList = Array.from(labelsToAdd).filter(l => !currentLabels.includes(l));
            if (addList.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                labels: addList
              });
            }
