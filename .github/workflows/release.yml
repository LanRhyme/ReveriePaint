name: Release Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get Tag Name
        id: tag
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          if [ "$TAG_NAME" = "refs/heads/main" ] || [ -z "$TAG_NAME" ]; then
            TAG_NAME="latest"
          fi
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Write Aifadian Config
        env:
          AIFADIAN_API_TOKEN: ${{ secrets.AIFADIAN_API_TOKEN }}
          AIFADIAN_USER_ID: ${{ secrets.AIFADIAN_USER_ID }}
        run: |
          if [ -n "$AIFADIAN_API_TOKEN" ]; then
            echo "AIFADIAN_API_TOKEN=$AIFADIAN_API_TOKEN" >> local.properties
            echo "AIFADIAN_USER_ID=$AIFADIAN_USER_ID" >> local.properties
          fi

      - name: Copy Native Libraries
        run: |
          chmod +x scripts/copy_jni_libs.sh
          ./scripts/copy_jni_libs.sh

      - name: Build Android APK
        run: ./gradlew assembleRelease || ./gradlew assembleDebug

      - name: Prepare Artifact
        run: |
          mkdir -p ci-artifacts
          APK=$(ls app/build/outputs/apk/release/*.apk app/build/outputs/apk/debug/*.apk 2>/dev/null | head -n 1)
          if [ -n "$APK" ]; then
            cp "$APK" "ci-artifacts/ReveriePaint-${{ steps.tag.outputs.tag }}.apk"
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ReveriePaint-${{ steps.tag.outputs.tag }}
          path: ci-artifacts/ReveriePaint-${{ steps.tag.outputs.tag }}.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ci-artifacts/ReveriePaint-${{ steps.tag.outputs.tag }}.apk
          generate_release_notes: true
