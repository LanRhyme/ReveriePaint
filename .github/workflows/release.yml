name: Release Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get Tag Name
        id: tag
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          if [ "$TAG_NAME" = "refs/heads/main" ] || [ -z "$TAG_NAME" ]; then
            TAG_NAME="latest"
          fi
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Write Aifadian Config
        env:
          AIFADIAN_API_TOKEN: ${{ secrets.AIFADIAN_API_TOKEN }}
          AIFADIAN_USER_ID: ${{ secrets.AIFADIAN_USER_ID }}
        run: |
          if [ -n "$AIFADIAN_API_TOKEN" ]; then
            echo "AIFADIAN_API_TOKEN=$AIFADIAN_API_TOKEN" >> local.properties
            echo "AIFADIAN_USER_ID=$AIFADIAN_USER_ID" >> local.properties
          fi

      - name: Write Telemetry Config
        # 未配置 secret 时不写入 -> BuildConfig.TELEMETRY_ENDPOINT 为空 -> 客户端整条上报链路 no-op
        env:
          TELEMETRY_ENDPOINT: ${{ secrets.TELEMETRY_ENDPOINT }}
          TELEMETRY_KEY: ${{ secrets.TELEMETRY_KEY }}
        run: |
          if [ -n "$TELEMETRY_ENDPOINT" ]; then
            echo "TELEMETRY_ENDPOINT=$TELEMETRY_ENDPOINT" >> local.properties
            echo "TELEMETRY_KEY=$TELEMETRY_KEY" >> local.properties
          fi

      - name: Copy Native Libraries
        run: |
          chmod +x scripts/copy_jni_libs.sh
          ./scripts/copy_jni_libs.sh

      - name: JNI Symbol Coverage Check
        # arm64 与 armv7 的预编译 jni 库都必须覆盖 Kotlin 声明的全部符号;
        # 缺一个就是一个 UnsatisfiedLinkError 崩溃 (2026-10-31 nativeSnapshotMode 事故)
        run: |
          chmod +x scripts/check_jni_symbols.sh
          ./scripts/check_jni_symbols.sh

      - name: Native Closure Symbol Check
        # JNI 门禁只查 Kotlin external fun 对 .so 导出, 查不到 .so 之间的 C/C++ 依赖。
        # 1.6.2 的 armeabi-v7a 包就是栽在这层: libkritacolorsmudgepaintop.so 引用
        # ReveriePigmentMix::isEnabled(), 闭包里没有任何库定义它, 32 位用户启动即崩。
        # 这个门禁对每个 ABI 求「未定义符号 - 闭包已定义 - Android 平台库」, 非空即失败。
        run: |
          chmod +x scripts/check_native_symbols.sh
          ./scripts/check_native_symbols.sh

      - name: Decode Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release.keystore
          fi

      - name: Build Android APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease -PenableAbiSplits=true

      - name: Prepare Artifact
        run: |
          mkdir -p ci-artifacts
          for apk in app/build/outputs/apk/release/*.apk app/build/outputs/apk/debug/*.apk; do
            [ -f "$apk" ] || continue
            b="$(basename "$apk")"
            if [[ "$b" =~ app-(.*)-release\.apk ]] || [[ "$b" =~ app-(.*)-debug\.apk ]]; then
              abi_part="${BASH_REMATCH[1]}"
              if [ "$abi_part" = "universal" ] || [ -z "$abi_part" ]; then
                cp "$apk" "ci-artifacts/ReveriePaint-${{ steps.tag.outputs.tag }}.apk"
              else
                cp "$apk" "ci-artifacts/ReveriePaint-${{ steps.tag.outputs.tag }}-${abi_part}.apk"
              fi
            else
              cp "$apk" "ci-artifacts/ReveriePaint-${{ steps.tag.outputs.tag }}.apk"
            fi
          done

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ReveriePaint-${{ steps.tag.outputs.tag }}
          path: ci-artifacts/*
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ci-artifacts/*
          generate_release_notes: true

      - name: Trigger MirrorChyanUploading
        if: startsWith(github.ref, 'refs/tags/') && github.repository_owner == 'LanRhyme'
        shell: bash
        run: |
          gh workflow run --repo $GITHUB_REPOSITORY mirrorchyan_release.yml -f tag=${{ steps.tag.outputs.tag }}
          gh workflow run --repo $GITHUB_REPOSITORY mirrorchyan_release_note.yml -f tag=${{ steps.tag.outputs.tag }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
